<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>The YeRooms</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta property="og:title" content="The YeRooms" />
    <meta property="og:description" content="You have noclipped out of reality." />
    <meta property="og:image" content="/ENEMY.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/ENEMY.jpg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      canvas { display: block; }

      /* ── Screen overlays ──────────────────────── */
      #death-vignette {
        position: fixed; inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        z-index: 50;
        transition: opacity 0.1s linear;
      }
      #screen-flash {
        position: fixed; inset: 0;
        opacity: 0;
        pointer-events: none;
        z-index: 51;
        transition: opacity 0.35s ease;
      }

      /* ── Click hint ───────────────────────────── */
      #click-hint {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 8px;
        color: rgba(255,240,160,0.75);
        font-family: monospace;
        font-size: 1.1rem;
        letter-spacing: 0.08em;
        pointer-events: none;
        text-shadow: 0 0 16px rgba(220,180,20,0.5);
      }
      #click-hint small { font-size: 0.72rem; opacity: 0.55; }

      /* ── Crosshair ────────────────────────────── */
      #crosshair {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%,-50%);
        width: 14px; height: 14px;
        pointer-events: none; display: none;
      }
      #crosshair::before, #crosshair::after {
        content: ''; position: absolute;
        background: rgba(255,255,255,0.65);
      }
      #crosshair::before { width:2px; height:100%; left:50%; transform:translateX(-50%); }
      #crosshair::after  { height:2px; width:100%; top:50%;  transform:translateY(-50%); }

      /* ── Clock ────────────────────────────────── */
      #clock {
        position: fixed;
        top: 14px; left: 16px;
        color: rgba(190,160,30,0.55);
        font-family: monospace; font-size: 0.72rem;
        letter-spacing: 0.18em;
        z-index: 10; pointer-events: none;
      }


      /* ── Mobile controls ──────────────────────── */
      #mobile-controls {
        position: fixed; bottom: 0; left: 0; right: 0;
        height: 200px; display: none;
        align-items: center; justify-content: space-between;
        padding: 0 24px 32px; pointer-events: none;
      }
      .ctrl-group {
        display: flex; gap: 10px; pointer-events: all;
        flex-shrink: 0; opacity: 0.55;
      }
      #move-controls { flex-direction: column; }
      .dp-btn {
        width: 88px; height: 88px; border-radius: 16px;
        background: rgba(200,160,20,0.15);
        border: 2px solid rgba(200,160,20,0.4);
        color: rgba(255,240,160,0.9);
        font-size: 1.7rem; line-height: 1;
        pointer-events: all; cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        display: flex; align-items: center; justify-content: center;
        touch-action: manipulation;
      }
      .dp-btn:active { background: rgba(200,160,20,0.35); opacity: 1; }

      /* ── Mobile pause button ───────────────────── */
      #mobile-pause {
        display: none;
        position: fixed; top: 10px; right: 14px;
        width: 60px; height: 28px; border-radius: 8px;
        background: rgba(200,160,20,0.1);
        border: 1px solid rgba(200,160,20,0.25);
        color: rgba(190,160,30,0.5);
        font-family: monospace; font-size: 0.6rem;
        letter-spacing: 0.15em;
        align-items: center; justify-content: center;
        pointer-events: all; cursor: pointer; z-index: 20;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      /* ── Death screen ─────────────────────────── */
      #death-overlay {
        position: fixed; inset: 0;
        background: #000;
        display: none; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 12px; z-index: 100;
      }
      .death-title {
        color: rgba(200,160,30,0.9);
        font-family: monospace; font-size: 1.4rem;
        letter-spacing: 0.35em;
        animation: flicker 4s ease-in-out infinite;
      }
      .death-sub {
        color: rgba(160,120,20,0.55);
        font-family: monospace; font-size: 0.7rem;
        letter-spacing: 0.15em; margin-bottom: 40px;
      }
      #play-again {
        margin-top: 12px;
        padding: 0 48px;
        height: 72px; border-radius: 14px;
        background: rgba(200,160,20,0.18);
        border: 2px solid rgba(200,160,20,0.55);
        color: rgba(255,240,160,0.95);
        font-family: monospace; font-size: 1rem;
        letter-spacing: 0.3em;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        animation: flicker 4s ease-in-out infinite;
        transition: background 0.15s;
      }
      #play-again:active { background: rgba(200,160,20,0.4); }

      #death-time {
        color: rgba(200,160,30,0.75);
        font-family: monospace; font-size: 0.85rem;
        letter-spacing: 0.2em; display: none;
      }
      #death-best {
        color: rgba(255,210,40,0.9);
        font-family: monospace; font-size: 0.7rem;
        letter-spacing: 0.22em; margin-bottom: 8px; display: none;
        animation: flicker 4s ease-in-out infinite;
      }

      @keyframes flicker {
        0%,100% { opacity: 1; }
        92% { opacity: 1; } 93% { opacity: 0.3; }
        94% { opacity: 1; } 96% { opacity: 0.5; } 97% { opacity: 1; }
      }

      /* ── Start screen ─────────────────────── */
      #start-screen {
        position: fixed; inset: 0;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.92) 60%, rgba(0,0,0,0.98) 100%);
        display: flex;
        align-items: center; justify-content: center;
        z-index: 200;
        padding: 32px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .start-center {
        display: flex; flex-direction: column;
        align-items: center; gap: 20px;
        text-align: center;
      }
      .disc-title {
        color: rgba(200,160,30,0.9);
        font-family: monospace; font-size: 1.6rem;
        letter-spacing: 0.3em;
        animation: flicker 4s ease-in-out infinite;
      }
      .disc-sound {
        color: rgba(255,240,160,0.85);
        font-family: monospace; font-size: 0.9rem;
        letter-spacing: 0.2em;
        border: 1px solid rgba(200,160,20,0.4);
        padding: 8px 20px; border-radius: 8px;
        background: rgba(200,160,20,0.08);
      }
      .disc-body {
        color: rgba(160,120,20,0.7);
        font-family: monospace; font-size: 0.72rem;
        letter-spacing: 0.12em;
        line-height: 1.8;
        max-width: 360px;
      }
      .disc-enter {
        color: rgba(200,160,30,0.5);
        font-family: monospace; font-size: 0.65rem;
        letter-spacing: 0.18em;
        margin-top: 24px;
        animation: flicker 4s ease-in-out infinite;
      }

      /* ── Leaderboard ─────────────────────────── */
      #leaderboard {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 220px;
        max-height: 60vh;
        overflow-y: auto;
        background: rgba(0,0,0,0.85);
        border: 1px solid rgba(200,160,20,0.2);
        border-radius: 12px;
        padding: 14px 12px;
        position: absolute; right: 40px;
      }
      #lb-title {
        color: rgba(200,160,30,0.9);
        font-family: monospace; font-size: 0.75rem;
        letter-spacing: 0.25em;
        margin-bottom: 6px;
        text-align: center;
      }
      .lb-row {
        display: flex; justify-content: space-between;
        color: rgba(255,240,160,0.7);
        font-family: monospace; font-size: 0.62rem;
        letter-spacing: 0.1em;
        padding: 3px 0;
        border-bottom: 1px solid rgba(200,160,20,0.1);
      }
      .lb-row .lb-rank { color: rgba(200,160,30,0.5); width: 22px; }
      .lb-row .lb-name { flex: 1; }
      .lb-row .lb-time { color: rgba(255,210,40,0.8); }
      #lb-empty {
        color: rgba(160,120,20,0.4);
        font-family: monospace; font-size: 0.6rem;
        text-align: center; margin-top: 12px;
      }

      /* Desktop: leaderboard on death screen */
      #leaderboard.on-death {
        position: fixed; top: 50%; left: 40px;
        transform: translateY(-50%);
        z-index: 110;
      }

      /* Toggle button (mobile only) */
      #lb-toggle {
        display: none;
        position: absolute; top: 12px; right: 14px;
        height: 28px; padding: 0 10px;
        background: rgba(200,160,20,0.1);
        border: 1px solid rgba(200,160,20,0.3);
        border-radius: 6px;
        color: rgba(255,240,160,0.7);
        font-family: monospace; font-size: 0.55rem;
        letter-spacing: 0.12em;
        align-items: center; justify-content: center;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      @media (min-width: 769px) {
        #lb-toggle { display: none !important; }
      }
      @media (max-width: 768px) {
        #start-screen { flex-direction: column; gap: 20px; }
        #leaderboard {
          display: none;
          position: static;
          width: 180px; max-height: 40vh;
          font-size: 0.55rem;
        }
        #leaderboard.visible { display: flex; }
        #leaderboard.on-death {
          position: fixed; top: 50px; right: 14px; left: auto;
          transform: none; width: 180px; max-height: 45vh;
        }
        #lb-toggle { display: flex; }
      }

      /* ── Name input on death ─────────────────── */
      #death-name-row {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 8px;
      }
      #death-name {
        width: 120px; height: 32px;
        background: rgba(200,160,20,0.08);
        border: 1px solid rgba(200,160,20,0.4);
        border-radius: 6px;
        color: rgba(255,240,160,0.9);
        font-family: monospace; font-size: 0.75rem;
        letter-spacing: 0.15em;
        text-align: center;
        text-transform: uppercase;
      }
      #death-name::placeholder { color: rgba(200,160,20,0.3); }
      #submit-score {
        height: 32px; padding: 0 14px;
        background: rgba(200,160,20,0.15);
        border: 1px solid rgba(200,160,20,0.5);
        border-radius: 6px;
        color: rgba(255,240,160,0.9);
        font-family: monospace; font-size: 0.6rem;
        letter-spacing: 0.15em;
        cursor: pointer;
      }
      #submit-score:disabled { opacity: 0.3; cursor: default; }
      #score-status {
        color: rgba(200,160,30,0.6);
        font-family: monospace; font-size: 0.55rem;
        letter-spacing: 0.1em;
        height: 14px;
      }

    </style>
  </head>
  <body>
    <div id="clock">00:00</div>
    <div id="death-vignette"></div>
    <div id="screen-flash"></div>

    <div id="start-screen">
      <div class="start-center">
        <div class="disc-title">The YeRooms</div>
        <div class="disc-sound">🔊 SOUND UP</div>
        <div class="disc-body">survive the horrors of the YeRooms.<br>see how long you can last.</div>
        <div class="disc-enter" id="start-hint">PRESS SPACE TO ENTER</div>
      </div>
      <div id="leaderboard">
        <div id="lb-title">TOP SURVIVORS</div>
        <div id="lb-list"></div>
        <div id="lb-empty">no scores yet</div>
      </div>
      <button id="lb-toggle">SCORES</button>
    </div>

    <div id="click-hint" style="display:none">
      <span id="hint-action">The YeRooms — Press Space</span>
      <small id="hint-sub">WASD / ARROWS · MOUSE · ESC TO PAUSE</small>
    </div>
    <div id="crosshair"></div>

    <div id="mobile-pause">PAUSE</div>

    <div id="mobile-controls">
      <!-- Left: turn left / right -->
      <div class="ctrl-group" id="turn-controls">
        <button class="dp-btn" id="dp-left">◀</button>
        <button class="dp-btn" id="dp-right">▶</button>
      </div>
      <!-- Right: forward / back -->
      <div class="ctrl-group" id="move-controls">
        <button class="dp-btn" id="dp-up">▲</button>
        <button class="dp-btn" id="dp-down">▼</button>
      </div>
    </div>

    <div id="death-overlay">
      <div class="death-title">YOU ARE LOST</div>
      <div class="death-sub">you have noclipped out of reality</div>
      <div id="death-time"></div>
      <div id="death-best"></div>
      <div id="death-name-row">
        <input id="death-name" type="text" maxlength="12" placeholder="YOUR NAME" autocomplete="off" />
        <button id="submit-score">SUBMIT</button>
      </div>
      <div id="score-status"></div>
      <button id="play-again">PLAY AGAIN</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
