<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>The Yerooms</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta property="og:title" content="The Yerooms" />
    <meta property="og:description" content="You have noclipped out of reality." />
    <meta property="og:image" content="/ENEMY.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/ENEMY.jpg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      canvas { display: block; }

      /* ── Screen overlays ──────────────────────── */
      #death-vignette {
        position: fixed; inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        z-index: 50;
        transition: opacity 0.1s linear;
      }
      #screen-flash {
        position: fixed; inset: 0;
        opacity: 0;
        pointer-events: none;
        z-index: 51;
        transition: opacity 0.35s ease;
      }

      /* ── Click hint ───────────────────────────── */
      #click-hint {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 8px;
        color: rgba(255,240,160,0.75);
        font-family: monospace;
        font-size: 1.1rem;
        letter-spacing: 0.08em;
        pointer-events: none;
        text-shadow: 0 0 16px rgba(220,180,20,0.5);
      }
      #click-hint small { font-size: 0.72rem; opacity: 0.55; }

      /* ── Crosshair ────────────────────────────── */
      #crosshair {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%,-50%);
        width: 14px; height: 14px;
        pointer-events: none; display: none;
      }
      #crosshair::before, #crosshair::after {
        content: ''; position: absolute;
        background: rgba(255,255,255,0.65);
      }
      #crosshair::before { width:2px; height:100%; left:50%; transform:translateX(-50%); }
      #crosshair::after  { height:2px; width:100%; top:50%;  transform:translateY(-50%); }

      /* ── Clock ────────────────────────────────── */
      #clock {
        position: fixed;
        top: 14px; left: 16px;
        color: rgba(190,160,30,0.55);
        font-family: monospace; font-size: 0.72rem;
        letter-spacing: 0.18em;
        z-index: 10; pointer-events: none;
      }


      /* ── Mobile controls ──────────────────────── */
      #mobile-controls {
        position: fixed; bottom: 0; left: 0; right: 0;
        height: 200px; display: none;
        align-items: center; justify-content: space-between;
        padding: 0 24px 32px; pointer-events: none;
      }
      .ctrl-group {
        display: flex; gap: 10px; pointer-events: all;
        flex-shrink: 0; opacity: 0.55;
      }
      #move-controls { flex-direction: column; }
      .dp-btn {
        width: 88px; height: 88px; border-radius: 16px;
        background: rgba(200,160,20,0.15);
        border: 2px solid rgba(200,160,20,0.4);
        color: rgba(255,240,160,0.9);
        font-size: 1.7rem; line-height: 1;
        pointer-events: all; cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        display: flex; align-items: center; justify-content: center;
        touch-action: manipulation;
      }
      .dp-btn:active { background: rgba(200,160,20,0.35); opacity: 1; }

      /* ── Mobile pause button ───────────────────── */
      #mobile-pause {
        display: none;
        position: fixed; top: 10px; right: 14px;
        width: 60px; height: 28px; border-radius: 8px;
        background: rgba(200,160,20,0.1);
        border: 1px solid rgba(200,160,20,0.25);
        color: rgba(190,160,30,0.5);
        font-family: monospace; font-size: 0.6rem;
        letter-spacing: 0.15em;
        align-items: center; justify-content: center;
        pointer-events: all; cursor: pointer; z-index: 20;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      /* ── Death screen ─────────────────────────── */
      #death-overlay {
        position: fixed; inset: 0;
        background: #000;
        display: none; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 12px; z-index: 100;
      }
      .death-title {
        color: rgba(200,160,30,0.9);
        font-family: monospace; font-size: 1.4rem;
        letter-spacing: 0.35em;
        animation: flicker 4s ease-in-out infinite;
      }
      .death-sub {
        color: rgba(160,120,20,0.55);
        font-family: monospace; font-size: 0.7rem;
        letter-spacing: 0.15em; margin-bottom: 40px;
      }
      #play-again {
        margin-top: 12px;
        padding: 0 48px;
        height: 72px; border-radius: 14px;
        background: rgba(200,160,20,0.18);
        border: 2px solid rgba(200,160,20,0.55);
        color: rgba(255,240,160,0.95);
        font-family: monospace; font-size: 1rem;
        letter-spacing: 0.3em;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        animation: flicker 4s ease-in-out infinite;
        transition: background 0.15s;
      }
      #play-again:active { background: rgba(200,160,20,0.4); }

      @keyframes flicker {
        0%,100% { opacity: 1; }
        92% { opacity: 1; } 93% { opacity: 0.3; }
        94% { opacity: 1; } 96% { opacity: 0.5; } 97% { opacity: 1; }
      }

    </style>
  </head>
  <body>
    <div id="clock">00:00</div>
    <div id="death-vignette"></div>
    <div id="screen-flash"></div>

    <div id="click-hint">
      <span id="hint-action">THE YEROOMS — PRESS SPACE</span>
      <small id="hint-sub">WASD / ARROWS · MOUSE · ESC TO PAUSE</small>
    </div>
    <div id="crosshair"></div>

    <div id="mobile-pause">PAUSE</div>

    <div id="mobile-controls">
      <!-- Left: turn left / right -->
      <div class="ctrl-group" id="turn-controls">
        <button class="dp-btn" id="dp-left">◀</button>
        <button class="dp-btn" id="dp-right">▶</button>
      </div>
      <!-- Right: forward / back -->
      <div class="ctrl-group" id="move-controls">
        <button class="dp-btn" id="dp-up">▲</button>
        <button class="dp-btn" id="dp-down">▼</button>
      </div>
    </div>

    <div id="death-overlay">
      <div class="death-title">YOU ARE LOST</div>
      <div class="death-sub">you have noclipped out of reality</div>
      <button id="play-again">PLAY AGAIN</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
